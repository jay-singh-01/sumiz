    <g transform="rotate(32 256 300)">
      <path d="M256 180C246 180 246 200 248 214L253 418L256 446L259 418L264 214C266 200 266 180 256 180Z" fill="#FFF4DE" stroke="url(#gold)" stroke-width="3"/>
      <ellipse cx="256" cy="204" rx="3.5" ry="13" fill="#9E0D44"/>
      <path d="M256 196C312 196 334 252 306 292C286 322 236 316 222 352" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
      <path d="M222 352C246 378 226 418 186 430C174 398 190 360 222 352Z" fill="url(#gold)" stroke="#FFF4DE" stroke-width="2"/>
    </g>
  </g>
