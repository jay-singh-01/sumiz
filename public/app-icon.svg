<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source for the PWA icons (npm run icons). Full-bleed background so it also works as a maskable icon; the mark sits inside the 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#FDE7C4"/>
    </linearGradient>
    <linearGradient id="rani" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0115F"/>
      <stop offset="1" stop-color="#9E0D44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/>
      <stop offset=".5" stop-color="#C9971C"/>
      <stop offset="1" stop-color="#8A6408"/>
    </linearGradient>
    <path id="arch" d="M136 448V240c0-36 14-52 32-62 2-28 24-46 48-48 8-22 24-32 40-50 16 18 32 28 40 50 24 2 46 20 48 48 18 10 32 26 32 62v208z"/>
